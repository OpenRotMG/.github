name: Check
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: check-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRotMG/.github
          path: pipeline
          persist-credentials: false
      - name: Install pinned Rust
        if: github.repository == 'OpenRotMG/Open-RotMG-Server'
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: github.repository == 'OpenRotMG/Open-RotMG-Server'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        with:
          workspaces: app
          shared-key: server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - run: bash pipeline/deployment/build.sh
