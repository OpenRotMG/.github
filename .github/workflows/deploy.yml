name: Deploy
on:
  workflow_call:
    secrets:
      DEPLOY_KEY:
        required: true
      PAGES_DEPLOY_TOKEN:
        required: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository_owner == 'OpenRotMG' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: OpenRotMG/.github
          path: pipeline
          persist-credentials: false
      - name: Install pinned Rust
        if: github.repository == 'OpenRotMG/Open-RotMG-Server'
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: github.repository == 'OpenRotMG/Open-RotMG-Server'
        env:
          RUSTUP_TOOLCHAIN: 1.94.1
        with:
          workspaces: app
          shared-key: server
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Test and build the triggering revision
        id: build
        run: bash pipeline/deployment/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deployment
          path: deploy.bundle
          if-no-files-found: error
      - name: Deploy and verify
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_USER: ${{ steps.build.outputs.user }}
          DEPLOY_COMMAND: ${{ steps.build.outputs.command }}
          DEPLOY_HOST: ${{ steps.build.outputs.host }}
        run: bash pipeline/deployment/send.sh
      - name: Request Pages publication
        if: github.repository == 'OpenRotMG/Open-RotMG-Server' || github.repository == 'OpenRotMG/Open-RotMG-Client'
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          : "${GH_TOKEN:?PAGES_DEPLOY_TOKEN is required to publish static game assets}"
          case "$GITHUB_REPOSITORY" in
            OpenRotMG/Open-RotMG-Server) field=server_revision ;;
            OpenRotMG/Open-RotMG-Client) field=client_revision ;;
            *) exit 1 ;;
          esac
          gh api --method POST repos/OpenRotMG/Open-RotMG-Website/actions/workflows/deploy.yml/dispatches -f ref=main -f "inputs[$field]=$GITHUB_SHA"
